[package]
name = "native"
version = "0.0.1"
edition = "2021"

[lib]
name = "native"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
cssparser = "0.38.0"
lightningcss = { version = "1.0.0-alpha.72", features = ["serde", "visitor", "sourcemap"] }
magnus = "0.9.1"
parcel_selectors = "0.28.3"
parcel_sourcemap = { version = "2.1.1", features = ["json"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
