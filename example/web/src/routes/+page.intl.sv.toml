[hero]
kicker = "Ruby-modulbundlare"
title = "Bygg Ruby-moduler som en modern frontendgraf"
line_one = "Bygg Ruby-moduler"
line_accent = "som en modern"
line_two = "frontendgraf."
summary = "Klenod ger Ruby ett importsystem inspirerat av ES-moduler. Importerna skapar en dependencygraf för uppdateringar i utvecklingsläget, produktionsbundles, och alla filtyper som dina plugins förstår."

[actions]
get_started = "Kom igång →"
github = "Visa på GitHub"
docs = "Läs dokumentationen →"
plugins = "Utforska plugins"

[commands]
install = "Installera"
build = "Bygg"
inspect = "Inspektera"
learn_more = "Kom igång →"

[features.imports]
title = "Importer definierar grafen"
body = "Ruby-moduler använder import-anrop inspirerade av ES-moduler. Varje importerad modul blir ett explicit beroende i applikationsgrafen."

[features.updates]
title = "Levande utveckling"
body = "När en kodfil ändras uppdaterar Klenod den delen av grafen och invalidaterar dess beroenden. Moduler evalueras igen först när applikationen behöver dem."

[features.runtime]
title = "Byggtidsberoenden stannar kvar"
body = "Produktionsläget laddar den serialiserade grafen med klenod-runtime. Byggplugins, kompilatorer och deras beroenden behöver inte följa med applikationen."

[features.plugins]
title = "Alla filer kan vara moduler"
body = "Plugins bestämmer hur filer löses upp, transformeras och ser ut vid runtime. Plugins gör det möjligt att importera Haml, CSS, JavaScript, bilder, data eller egna format."

[architecture]
kicker = "Arkitektur"
title = "En graf. Tydliga faser."

[architecture.collection]
title = "Samla före evaluering"
body = "Klenod kan läsa importeade filer, transformera källkod och generera assets utan att köra applikationskod."

[architecture.relative]
title = "Relativa sökvägar"
body = "Importer resolvas från modulen som deklarerar dem. Kanoniska modul-ID:n gör varje beroende entydigt."

[architecture.framework]
title = "Ramverksneutralt"
body = "Plugins anpassar källfiler till komponenter och runtime-värden. Rendering och applikationspolicy stannar i ramverket."

[architecture.inspectable]
title = "Inspekterbart resultat"
body = "Exportera grafen, följ source maps och se vilka moduler och assets som kan nås från en entrypoint."

[cta]
kicker = "Redo att bygga"
title = "Bygg din första Klenod-app."
body = "Börja med en Ruby-entrypoint, importera ett beroende och lägg till plugins när applikationen växer."
