[hero]
kicker = "Ruby module bundler"
title = "Build Ruby modules like a modern frontend graph"
line_one = "Build Ruby modules"
line_accent = "like a modern"
line_two = "frontend graph."
summary = "Klenod brings an ES Module-inspired import system to Ruby. Those imports create a dependency graph for development updates, production bundles, and every file type your plugins understand."

[actions]
get_started = "Get started →"
github = "View on GitHub"
docs = "Read the docs →"
plugins = "Explore plugins"

[commands]
install = "Install"
build = "Build"
inspect = "Inspect"
learn_more = "Getting started →"

[features.imports]
title = "Imports define the graph"
body = "Ruby modules use import calls inspired by ES Modules. Each resolved import becomes an explicit dependency in the application graph."

[features.updates]
title = "Development stays live"
body = "When a source file changes, Klenod updates that part of the graph and invalidates its dependents. Modules evaluate again only when the application needs them."

[features.runtime]
title = "Build-time dependencies stay behind"
body = "Production mode loads the serialized graph with klenod-runtime. Build plugins, compilers, and their dependencies do not need to ship with the application."

[features.plugins]
title = "Any file can be a module"
body = "Plugins define how files resolve, transform, and appear at runtime. Plugins make it possible to import Haml, CSS, JavaScript, images, data, or your own formats."

[architecture]
kicker = "Architecture"
title = "One graph. Clear phases."

[architecture.collection]
title = "Collect before evaluation"
body = "Klenod can read imports, transform sources, and emit assets without running application code."

[architecture.relative]
title = "Relative by default"
body = "Imports resolve from the module that declares them. Canonical module IDs keep every dependency unambiguous."

[architecture.framework]
title = "Framework-neutral"
body = "Plugins adapt source files to components and runtime values. Rendering and application policy stay with the framework."

[architecture.inspectable]
title = "Inspectable output"
body = "Export the graph, follow source maps, and see which modules and assets are reachable from an entrypoint."

[cta]
kicker = "Ready to build"
title = "Build your first Klenod-app."
body = "Start with one Ruby entrypoint, import a dependency, and add plugins as the application grows."
