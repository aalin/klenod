[header]
kicker = "Assets"
title = "Images become generated browser assets"
summary = "Assets are imported through routed Haml pages and emitted with generated variants for responsive image markup."

[css]
title = "CSS url()"
body = "CSS can reference image files with `url(\"./coffee.jpg\")`; the CSS plugin rewrites the URL to the generated asset path."

[patterns]
title = "Asset patterns"

[picture]
title = "Picture element"
body = "`picture` can combine a generated WebP source with a JPEG fallback while reusing each import's `srcset` and `sizes` metadata."

[image_set]
title = "CSS image-set()"
body = "Ruby can build an `image-set()` value from imported image variants and pass it to CSS with a custom property."

