name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick libmagickwand-dev pkg-config
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Read native build dependency versions
        id: native-build-dependencies
        run: |
          bundle exec ruby -e '
            versions = %w[rake-compiler rb_sys].map { "#{it}-#{Gem::Specification.find_by_name(it).version}" }
            puts "versions=#{versions.join("-")}"
          ' >> "$GITHUB_OUTPUT"

      - name: Restore JavaScript native extension
        id: javascript-native-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: gems/klenod-plugin-javascript/lib/klenod/plugin/javascript/native.*
          key: native-javascript-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-build-dependencies.outputs.versions }}-${{ hashFiles('.ruby-version', 'gems/klenod-plugin-javascript/Rakefile', 'gems/klenod-plugin-javascript/*.gemspec', 'gems/klenod-plugin-javascript/ext/native/Cargo.toml', 'gems/klenod-plugin-javascript/ext/native/Cargo.lock', 'gems/klenod-plugin-javascript/ext/native/extconf.rb', 'gems/klenod-plugin-javascript/ext/native/src/**/*.rs') }}

      - name: Compile JavaScript native extension
        if: steps.javascript-native-cache.outputs.cache-hit != 'true'
        run: bundle exec rake -C gems/klenod-plugin-javascript compile

      - name: Restore CSS native extension
        id: css-native-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: gems/klenod-plugin-css/lib/klenod/plugin/css/native.*
          key: native-css-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-build-dependencies.outputs.versions }}-${{ hashFiles('.ruby-version', 'gems/klenod-plugin-css/Rakefile', 'gems/klenod-plugin-css/*.gemspec', 'gems/klenod-plugin-css/ext/native/Cargo.toml', 'gems/klenod-plugin-css/ext/native/Cargo.lock', 'gems/klenod-plugin-css/ext/native/extconf.rb', 'gems/klenod-plugin-css/ext/native/src/**/*.rs') }}

      - name: Compile CSS native extension
        if: steps.css-native-cache.outputs.cache-hit != 'true'
        run: bundle exec rake -C gems/klenod-plugin-css compile

      - name: Install example web bundle
        working-directory: example/web
        run: bundle install
      - name: Install example box bundle
        working-directory: example/box
        run: bundle install
      - name: Run the default task
        run: bundle exec rake
      - name: Build source gems
        run: bundle exec rake build

  dependabot:
    needs: build
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Auto-merge patch updates
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch update
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Enable auto-merge for patch update
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
